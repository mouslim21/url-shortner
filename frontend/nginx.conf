# Server-block template: render into /etc/nginx/conf.d/default.conf before startup.
# Required: URL_SERVICE_HOST (DNS name), URL_SERVICE_PORT, DNS_RESOLVER (IP address).
# Compose example: url-service, 8000, 127.0.0.11.
# Kubernetes: use the Service FQDN, Service port, and cluster DNS nameserver IP.
# Substitute ONLY these environment variables; retain Nginx's own $variables:
# envsubst '${URL_SERVICE_HOST} ${URL_SERVICE_PORT} ${DNS_RESOLVER}' < frontend/nginx.conf > /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    resolver_timeout 2s;
    set $url_service "${URL_SERVICE_HOST}:${URL_SERVICE_PORT}";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"healthy"}';
    }

    location /api/ {
        proxy_pass http://$url_service$request_uri;
    }

    location /r/ {
        proxy_pass http://$url_service$request_uri;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|styles\.css|app\.js)$ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
