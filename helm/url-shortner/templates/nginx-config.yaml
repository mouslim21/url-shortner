apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortner.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr notice;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        resolver {{ .Values.frontend.dnsResolver }} valid=10s ipv6=off;
        resolver_timeout 2s;
        set $url_service "url-service.{{ .Release.Namespace }}.svc.cluster.local:8000";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        location = /health {
          default_type application/json;
          return 200 '{"status":"healthy"}';
        }
        location /api/ { proxy_pass http://$url_service$request_uri; }
        location /r/ { proxy_pass http://$url_service$request_uri; }
        location = / { try_files /index.html =404; }
        location ~ ^/(index\.html|styles\.css|app\.js)$ { try_files $uri =404; }
        location / { return 404; }
      }
    }
