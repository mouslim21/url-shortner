{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: url-shortner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "url-shortner.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: frontend
                port:
                  number: {{ (index $.Values.components "frontend").servicePort }}
          {{- end }}
{{- end }}
