{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "url-shortner.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "url-shortner.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $component.servicePort }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "url-shortner.labels" $ | nindent 4 }}
spec:
  {{- if not (index $.Values.autoscaling $name).enabled }}
  replicas: {{ $component.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      {{- if eq $name "frontend" }}
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/nginx-config.yaml") $ | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.runAsUser }}
        runAsGroup: {{ $component.runAsUser }}
        fsGroup: {{ $component.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $component.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if eq $name "frontend" }}
          command: ["nginx"]
          args: ["-g", "daemon off;"]
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $component.containerPort }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          {{- if ne $name "frontend" }}
          env:
            - name: AWS_REGION
              value: {{ $.Values.awsRegion | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ $.Values.awsRegion | quote }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            {{- if eq $name "url-service" }}
            - name: URLS_TABLE_NAME
              value: short_urls
            - name: ANALYTICS_SERVICE_URL
              value: "http://analytics-service.{{ $.Release.Namespace }}.svc.cluster.local:8000"
            - name: ANALYTICS_TIMEOUT_SECONDS
              value: {{ $.Values.analyticsTimeoutSeconds | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ $.Values.publicBaseUrl | quote }}
            {{- else }}
            - name: ANALYTICS_TABLE_NAME
              value: url_analytics
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml $component.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
            {{- if eq $name "frontend" }}
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            {{- end }}
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
        {{- if eq $name "frontend" }}
        - name: nginx-config
          configMap:
            name: frontend-nginx
        {{- end }}
{{- end }}
