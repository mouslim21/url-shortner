services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    environment:
      URL_SERVICE_HOST: url-service
      URL_SERVICE_PORT: "8000"
      DNS_RESOLVER: 127.0.0.11
    depends_on:
      url-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  url-service:
    build: ./services/url-service
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      URLS_TABLE_NAME: short_urls
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      ANALYTICS_SERVICE_URL: http://analytics-service:8000
      ANALYTICS_TIMEOUT_SECONDS: "0.3"
      PUBLIC_BASE_URL: http://localhost:8080
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      analytics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  analytics-service:
    build: ./services/analytics-service
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      ANALYTICS_TABLE_NAME: url_analytics
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  dynamodb-init:
    build: ./services/analytics-service
    command: ["python", "/scripts/init_dynamodb.py"]
    volumes:
      - ./scripts/init_dynamodb.py:/scripts/init_dynamodb.py:ro
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_EC2_METADATA_DISABLED: "true"
      DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
    depends_on:
      dynamodb-local:
        condition: service_started
    restart: "no"
