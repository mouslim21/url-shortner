name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_ACCOUNT_ID: '957280466878'

permissions:
  contents: read

jobs:
  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose configuration
        run: docker compose config --quiet

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.9,<1.0'
      - name: Validate Ruff configuration
        run: ruff check --config pyproject.toml --show-settings > /dev/null
      - name: Lint Python files
        run: ruff check --config pyproject.toml .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Pytest
        run: python -m pip install 'pytest>=8.3,<9.0'
      - name: Test image publishing safeguards
        run: python -m pytest scripts/tests tests/load
      - name: Run service tests when present
        shell: bash
        run: |
          for service in services/url-service services/analytics-service; do
            if find "$service/tests" -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
              if [ -f "$service/requirements-dev.txt" ]; then
                python -m pip install -r "$service/requirements-dev.txt"
              elif [ -f "$service/requirements.txt" ]; then
                python -m pip install -r "$service/requirements.txt"
              fi
              (cd "$service" && python -m pytest tests)
            else
              echo "No tests yet in $service."
            fi
          done

  images:
    name: Build and scan (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: ./frontend
          - component: url-service
            context: ./services/url-service
          - component: analytics-service
            context: ./services/analytics-service
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build image once
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: url-shortner-${{ matrix.component }}:${{ github.sha }}
      - name: Save image for scanning and publishing
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE_TAG: ${{ github.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/image-${{ matrix.component }}
        run: |
          mkdir -p "$ARTIFACT_DIR"
          docker save "url-shortner-$COMPONENT:$IMAGE_TAG" -o "$ARTIFACT_DIR/image.tar"
          docker image inspect "url-shortner-$COMPONENT:$IMAGE_TAG" --format '{{.Id}}' > "$ARTIFACT_DIR/image-id.txt"
      - name: Report all vulnerability severities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          input: ${{ runner.temp }}/image-${{ matrix.component }}/image.tar
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: '0'
          format: json
          output: trivy-${{ matrix.component }}.json
          timeout: 10m
      - name: Block fixable HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          skip-setup-trivy: true
          input: ${{ runner.temp }}/image-${{ matrix.component }}/image.tar
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          timeout: 10m
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          retention-days: 7
          if-no-files-found: warn
      - name: Upload validated image
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ runner.temp }}/image-${{ matrix.component }}/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish validated images to ECR
    needs: [compose, lint, tests, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mouslim21/url-shortner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ecr-publish-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: images
      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: github-images-${{ github.run_id }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish saved images with immutable SHA tags
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: python3 scripts/publish_images.py

  deploy:
    name: Deploy nonprod
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'mouslim21/url-shortner'
    # The EKS API is private. This trusted runner must have VPC connectivity.
    runs-on: [self-hosted, linux, x64, nonprod-eks]
    environment: nonprod
    timeout-minutes: 30
    concurrency:
      group: deploy-url-shortner-nonprod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare isolated kubeconfig
        run: echo "KUBECONFIG=$RUNNER_TEMP/url-shortner-$GITHUB_RUN_ID.kubeconfig" >> "$GITHUB_ENV"
      - name: Check deployment role configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: test -n "$AWS_DEPLOY_ROLE_ARN"
      - name: Authenticate with deployment OIDC role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          role-session-name: github-deploy-${{ github.run_id }}
          unset-current-credentials: true
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.1
      - uses: azure/setup-kubectl@v5.2.0
        with:
          version: v1.35.0
      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig --name url-shortner-nonprod-eks --region us-east-1
          kubectl auth can-i patch deployments -n url-shortner | grep -x yes
          if kubectl auth can-i patch deployments -n kube-system; then
            echo "Deployment identity must not manage kube-system."
            exit 1
          fi
      - name: Validate Helm chart
        run: |
          helm lint helm/url-shortner -f helm/url-shortner/values-nonprod.yaml --set-string image.tag="$IMAGE_TAG"
          helm template url-shortner helm/url-shortner --namespace url-shortner -f helm/url-shortner/values-nonprod.yaml --set-string image.tag="$IMAGE_TAG" > "$RUNNER_TEMP/url-shortner-rendered.yaml"
      - name: Deploy exact published commit
        run: |
          EXISTING_HOST=$(kubectl -n url-shortner get ingress url-shortner --ignore-not-found -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          APP_BASE_URL="http://localhost:8080"
          if [ -n "$EXISTING_HOST" ]; then APP_BASE_URL="http://$EXISTING_HOST"; fi
          helm upgrade --install url-shortner helm/url-shortner \
            --namespace url-shortner -f helm/url-shortner/values-nonprod.yaml \
            --set-string image.tag="$IMAGE_TAG" --set-string publicBaseUrl="$APP_BASE_URL" \
            --atomic --wait --timeout 10m --history-max 5
          kubectl -n url-shortner wait --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' ingress/url-shortner --timeout=5m
          ALB_HOST=$(kubectl -n url-shortner get ingress url-shortner -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          # The hostname exists only after the first Ingress reconciliation.
          # Update the backend's public URL without rebuilding or changing images.
          if [ "$APP_BASE_URL" != "http://$ALB_HOST" ]; then
            helm upgrade --install url-shortner helm/url-shortner \
              --namespace url-shortner -f helm/url-shortner/values-nonprod.yaml \
              --set-string image.tag="$IMAGE_TAG" --set-string publicBaseUrl="http://$ALB_HOST" \
              --atomic --wait --timeout 5m --history-max 5
          fi
          for deployment in frontend url-service analytics-service; do
            kubectl -n url-shortner rollout status "deployment/$deployment" --timeout=180s
          done
          kubectl -n url-shortner get deployments,services,ingress
          echo "Application URL: http://$ALB_HOST"
          echo "Deployed commit: $IMAGE_TAG"
      - name: Remove temporary kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/url-shortner-$GITHUB_RUN_ID.kubeconfig"
